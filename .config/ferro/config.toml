timezone = "Europe/Paris"

[telegram]
owner_chat_id = 562414804

[paths]
obsidian_vault = "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Notes"
memory = "~/.ferro/memory"

[claude]
allowed_tools = "Read,Write,Edit,Glob,Grep,Bash,Agent"
model = "opus"

[[tasks]]
name = "morning-briefing"
schedule = "0 30 5 * * *"
prompt = """
Briefing matinal pour Co. Collecte toutes les infos en parallèle avec des sous-agents, puis envoie UN SEUL message Telegram bien formaté.

Collecte (en parallèle via sous-agents) :
1. Calendar — événements du jour (skill: calendar)
2. Reminders — rappels en cours et à faire aujourd'hui + overdue (skill: reminder)
3. GitHub — notifications, PRs en attente de review, mes PRs ouvertes (skill: github)
4. Obsidian — relire le journal de la veille, checker inbox.md (skill: notes)
5. Slack — résumé des messages importants de la nuit (skill: slack)
6. Météo — conditions du jour à Lyon (web search)
7. Running — utiliser le CLI garmin (skill: garmin) + vault Obsidian :
   - Fitness live : `garmin training readiness --json`, `garmin health hrv --json`, `garmin training scores --json`
   - Training status : `garmin training status --json`
   - Dernière activité : `garmin activities list -t running --limit 1 --json` puis `garmin activities get <ID> --json`
   - Volume semaine : `garmin activities list -t running --after <lundi> --json` pour calculer le total km
   - Séance du jour si prévue dans le plan (running/races/2026-04-12 Odyssée Beaujolaise 21km/Entraînement.md)
   - Renfo prévu aujourd'hui ? Checker si mardi ou jeudi (séance "Renfo Genou - Patte d'oie")
   - ACWR : alerter si >1.3 ou <0.7
   - J-X avant l'Odyssée Beaujolaise (12 avril 2026, objectif 2h10)
   - Si les données montrent un écart avec le plan, suggérer un ajustement

Format du message Telegram (markdown) :
- Titre : ☀️/🌧️ Briefing du {date}
- Section par catégorie, concis, avec emojis pour la lisibilité
- Si rien de notable dans une catégorie, l'omettre
- Section running toujours présente avec métriques clés + séance du jour
- Finir par un mot d'encouragement ou une remarque utile
"""

[[tasks]]
name = "evening-debrief"
schedule = "0 0 19 * * *"
prompt = """
Debrief du soir pour Co. Collecte les infos en parallèle avec des sous-agents, puis envoie UN SEUL message Telegram bien formaté.

Collecte (en parallèle via sous-agents) :
1. Running — utiliser le CLI garmin (skill: garmin) :
   - Check activité du jour : `garmin activities list -t running --after {today} --json`
   - Si run : `garmin activities get <ID> --json` + `garmin activities splits <ID> --json` + `garmin activities hr-zones <ID> --json`
   - Comparer vs plan prévu (running/races/2026-04-12 Odyssée Beaujolaise 21km/Entraînement.md)
   - Analyse : bon run ? trop intense ? pas assez ? ajustement pour demain ?
   - Fitness du soir : `garmin training readiness --json`, `garmin health hrv --json`
   - Body battery : `garmin health body-battery --json`
   - Si renfo prévu (mardi/jeudi) et pas fait, le signaler
   - Si pas de run et qu'il y avait une séance prévue : le signaler
2. GitHub — PRs mergées aujourd'hui, reviews en attente, avancées notables (skill: github)
3. Calendar — événements de demain matin (skill: calendar)
4. Obsidian — résumé du journal du jour, items restants dans inbox (skill: notes)

Format du message Telegram (markdown) :
- Titre : 🌙 Debrief du {date}
- Section running en premier (c'est le plus important)
- Sections concises avec emojis
- Rappel de la séance running + renfo de demain si prévu
- Si rien de notable dans une catégorie, l'omettre
"""
